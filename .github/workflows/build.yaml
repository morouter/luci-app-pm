name: 2600 metros más cerca de las estrellas.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Suéltame, Bogotá
    runs-on: ubuntu-latest
    env:
      project_name: luci-app-pm

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          path: ${{ env.project_name }}

      - name: Get Version
        id: get_version
        run: |
          cd ${{ env.project_name }}
          VERSION=$(grep -E "^PKG_VERSION[[:space:]]*:=" Makefile | sed -E 's/.*:=[[:space:]]*//' | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download and Initialize SDK
        id: sdk
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install build-essential gettext xsltproc python3-pyelftools

          sdk_name=openwrt-sdk-x86-64_gcc-15.3.0_musl.Linux-x86_64
          echo "sdk_name=$sdk_name" >> $GITHUB_OUTPUT

          curl -LO https://la.867678.xyz/sdk/$sdk_name.tar.zst

          tar -xvf $sdk_name.tar.zst
          rm $sdk_name.tar.zst
          cd $sdk_name

          make defconfig
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build!
        shell: bash
        run: |
          mv ${{ env.project_name }} ${{ steps.sdk.outputs.sdk_name }}/package/
          cd ${{ steps.sdk.outputs.sdk_name }}
          make package/${{ env.project_name }}/compile V=s -j$(nproc)

      - name: Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: V${{ steps.get_version.outputs.version }}
          files: ${{ steps.sdk.outputs.sdk_name }}/bin/packages/x86_64/base/*.apk
          body: |
            # 📝 Release Note
            - Fixes and improvements
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send to mirror
        uses: moaeiou/moaeiou/actions/rsync@main
        with:
          local: ${{ steps.sdk.outputs.sdk_name }}/bin/packages/x86_64/base/
          remote: luci-app/pm/
          key: ${{ secrets.SSH_KEY }}
          extra: --delete
